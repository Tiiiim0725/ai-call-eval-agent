<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="kiki-document-id" content="kiki-interactive-flow-v5">
  <title>Kiki 猎头通话策略节点图｜交互检查版</title>
  <style>:root {
  color-scheme: light;
  --page-bg: #ffffff;
  --panel-bg: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --border: #cbd5e1;
  --soft: #f8fafc;
  --gray: #64748b;
  --gray-fill: #f8fafc;
  --green: #16a34a;
  --green-fill: #ecfdf5;
  --red: #dc2626;
  --red-fill: #fef2f2;
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-width: 320px;
  background: var(--page-bg);
  color: var(--text);
}

button,
input {
  font: inherit;
}

.app-shell {
  display: flex;
  align-items: flex-start;
  width: 100%;
  min-height: 100vh;
  background: var(--page-bg);
}

.diagram-region {
  min-width: 0;
  flex: 1 1 auto;
  background: #ffffff;
}

.diagram-wrap {
  width: 100%;
  min-width: 760px;
}

.diagram-svg {
  display: block;
  width: 100%;
  height: auto;
  background: #ffffff;
}

.status-sidebar {
  position: sticky;
  top: 0;
  flex: 0 0 320px;
  width: 320px;
  height: 100vh;
  overflow-y: auto;
  padding: 24px 22px 28px;
  border-left: 1px solid var(--border);
  background: var(--panel-bg);
  box-shadow: -8px 0 24px rgb(15 23 42 / 7%);
  z-index: 10;
}

.sidebar-header {
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  margin: 0;
  font-size: 22px;
  line-height: 1.35;
  font-weight: 700;
}

.sidebar-header p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.count-section,
.action-section {
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}

.count-section h2 {
  margin: 0 0 12px;
  font-size: 15px;
  line-height: 1.4;
  font-weight: 700;
}

.count-grid {
  display: grid;
  gap: 8px;
}

.count-row {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  gap: 8px;
  align-items: center;
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--soft);
  color: #334155;
  font-size: 13px;
}

.count-row strong {
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}

.count-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: currentColor;
}

.count-row.is-gray {
  color: var(--gray);
}

.count-row.is-green {
  color: var(--green);
  border-color: #bbf7d0;
  background: var(--green-fill);
}

.count-row.is-red {
  color: var(--red);
  border-color: #fecaca;
  background: var(--red-fill);
}

.note-total {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.note-total strong {
  color: var(--text);
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}

.action-section {
  display: grid;
  gap: 9px;
}

.action-section button {
  width: 100%;
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid #94a3b8;
  border-radius: 8px;
  background: #ffffff;
  color: #1e293b;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.action-section button:hover {
  border-color: #475569;
  background: #f8fafc;
}

.action-section button:focus-visible {
  outline: 3px solid rgb(59 130 246 / 35%);
  outline-offset: 2px;
}

.action-section button[aria-pressed="true"] {
  border-color: #2563eb;
  background: #eff6ff;
  color: #1d4ed8;
}

.save-status,
.error-status {
  margin: 16px 0 0;
  font-size: 12px;
  line-height: 1.6;
}

.save-status {
  color: var(--muted);
}

.error-status {
  padding: 10px;
  border: 1px solid #fecaca;
  border-radius: 8px;
  background: var(--red-fill);
  color: #991b1b;
}

.diagram-svg .node,
.diagram-svg .edge {
  cursor: pointer;
}

.diagram-svg .node[data-state="0"] .node-shape {
  fill: var(--gray-fill) !important;
  stroke: var(--gray) !important;
}

.diagram-svg .node[data-state="0"] .node-text {
  fill: #334155 !important;
}

.diagram-svg .node[data-state="1"] .node-shape {
  fill: var(--green-fill) !important;
  stroke: var(--green) !important;
}

.diagram-svg .node[data-state="1"] .node-text {
  fill: #14532d !important;
}

.diagram-svg .node[data-state="2"] .node-shape {
  fill: var(--red-fill) !important;
  stroke: var(--red) !important;
}

.diagram-svg .node[data-state="2"] .node-text {
  fill: #7f1d1d !important;
}

.diagram-svg .edge[data-state="0"] > path:not(.edge-hit) {
  stroke: #94a3b8 !important;
}

.diagram-svg .edge[data-state="1"] > path:not(.edge-hit) {
  stroke: var(--green) !important;
}

.diagram-svg .edge[data-state="2"] > path:not(.edge-hit) {
  stroke: var(--red) !important;
}

.diagram-svg .edge-label-anchor {
  fill: none !important;
  stroke-width: 1.5px !important;
  pointer-events: none;
}

.diagram-svg .edge[data-state="0"] .edge-label-anchor {
  stroke: #94a3b8 !important;
}

.diagram-svg .edge[data-state="1"] .edge-label-anchor {
  stroke: #16a34a !important;
}

.diagram-svg .edge[data-state="2"] .edge-label-anchor {
  stroke: #dc2626 !important;
}

.diagram-svg .edge[data-state="0"] .edge-label rect {
  fill: var(--gray-fill) !important;
  stroke: #cbd5e1 !important;
}

.diagram-svg .edge[data-state="0"] .edge-label text {
  fill: #475569 !important;
}

.diagram-svg .edge[data-state="1"] .edge-label rect {
  fill: var(--green-fill) !important;
  stroke: #86efac !important;
}

.diagram-svg .edge[data-state="1"] .edge-label text {
  fill: #166534 !important;
}

.diagram-svg .edge[data-state="2"] .edge-label rect {
  fill: var(--red-fill) !important;
  stroke: #fca5a5 !important;
}

.diagram-svg .edge[data-state="2"] .edge-label text {
  fill: #991b1b !important;
}

.diagram-svg .edge > .edge-hit,
.diagram-svg .edge:hover > .edge-hit {
  fill: none !important;
  stroke: transparent !important;
  stroke-width: 20 !important;
  opacity: 0 !important;
  pointer-events: stroke;
}

.diagram-svg .node:focus-visible .node-shape {
  stroke-width: 5px !important;
}

.diagram-svg .edge:focus-visible > path:not(.edge-hit) {
  stroke-width: 5px !important;
  opacity: 1;
}

.diagram-svg #legend .edge-label rect {
  fill: #f8fafc !important;
  stroke: #cbd5e1 !important;
}

.diagram-svg #legend .edge-label text,
.diagram-svg #legend .legend-text {
  fill: #64748b !important;
}

.diagram-svg #legend line {
  stroke: #94a3b8 !important;
}

.diagram-svg.is-adding-note {
  cursor: crosshair;
}

.diagram-svg .flow-note {
  cursor: default;
}

.diagram-svg .flow-note.is-dragging {
  opacity: 0.9;
}

.note-card {
  display: flex;
  flex-direction: column;
  width: 220px;
  height: 120px;
  overflow: hidden;
  border: 2px solid #d4a72c;
  border-radius: 10px;
  background: #fffdf0;
  color: #422006;
  box-shadow: 0 4px 12px rgb(66 32 6 / 18%);
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

.note-header {
  display: flex;
  flex: 0 0 28px;
  align-items: center;
  justify-content: space-between;
  padding: 0 7px 0 10px;
  border-bottom: 1px solid #f0cf68;
  background: #fef3c7;
  color: #713f12;
  font-size: 12px;
  font-weight: 700;
  cursor: move;
  user-select: none;
  touch-action: none;
}

.note-remove {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #92400e;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}

.note-remove:hover,
.note-remove:focus-visible {
  background: #fde68a;
  outline: none;
}

.note-editor {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 9px 10px;
  color: #422006;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  outline: none;
  cursor: text;
}

.note-editor:empty::before {
  content: attr(data-placeholder);
  color: #a16207;
  opacity: 0.65;
}

.note-editor:focus {
  box-shadow: inset 0 0 0 2px rgb(217 119 6 / 25%);
}

@media (max-width: 980px) {
  .app-shell {
    display: block;
  }

  .status-sidebar {
    position: static;
    width: 100%;
    height: auto;
    padding: 18px;
    border-left: 0;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 18px rgb(15 23 42 / 6%);
  }

  .diagram-region {
    overflow-x: auto;
  }

  .diagram-wrap {
    min-width: 760px;
  }

  .count-section {
    display: inline-block;
    width: calc(50% - 8px);
    vertical-align: top;
  }

  .count-section:nth-of-type(2) {
    margin-left: 12px;
  }
}

@media (max-width: 560px) {
  .count-section {
    display: block;
    width: 100%;
  }

  .count-section:nth-of-type(2) {
    margin-left: 0;
  }
}
</style>
</head>
<body>
  <main id="kiki-flow-app" class="app-shell">
    <section class="diagram-region" aria-label="Kiki 猎头通话策略节点图">
      <div class="diagram-wrap"><svg class="diagram-svg" data-edge-readability="hybrid-v1" xmlns="http://www.w3.org/2000/svg" width="2200" height="5310" viewBox="0 0 2200 5310" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Kiki 猎头通话策略纵向阅读图</title>
  <desc id="chart-desc">七个纵向决策阶段、41 个业务节点和 59 条业务跳转。所有常规流程自上向下，横向位置只表示同一判断的并列去向，三个回环以局部返回引用表示。</desc>
  <defs>
    <marker id="arrow-struct" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" /></marker>
    <marker id="arrow-pos" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" /></marker>
    <marker id="arrow-neg" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" /></marker>
    <marker id="arrow-neutral" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" /></marker>
    <marker id="arrow-life" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6" /></marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10" /></filter>
  </defs>
  <style>
    svg { background: #FFFFFF; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    .chart-title { font-size: 28px; font-weight: 700; fill: #0F172A; }
    .chart-subtitle { font-size: 15px; fill: #64748B; }
    .legend-text { font-size: 14px; fill: #334155; }
    .phase-index { font-size: 24px; font-weight: 700; fill: #0F172A; }
    .phase-title { font-size: 18px; font-weight: 700; fill: #0F172A; }
    .phase-question { font-size: 14px; font-weight: 600; fill: #334155; }
    .phase-output { font-size: 13px; fill: #64748B; }
    .node { cursor: default; }
    .node-shape { filter: url(#soft-shadow); transition: stroke-width 120ms ease; }
    .node:hover .node-shape { stroke-width: 4px; }
    .node-text { pointer-events: none; dominant-baseline: middle; }
    .node-title { font-size: 15px; font-weight: 700; }
    .node-detail { font-size: 13px; font-weight: 400; }
    .node-action .node-shape { fill: #FFFFFF; stroke: #64748B; stroke-width: 2; }
    .node-action .node-text { fill: #0F172A; }
    .node-decision .node-shape { fill: #FEFCE8; stroke: #CA8A04; stroke-width: 2.2; }
    .node-decision .node-text { fill: #422006; }
    .node-unknown .node-shape { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 8 6; }
    .node-unknown .node-text { fill: #64748B; }
    .node-success .node-shape { fill: #ECFDF5; stroke: #16A34A; stroke-width: 2.2; }
    .node-success .node-text { fill: #14532D; }
    .node-handoff .node-shape { fill: #ECFEFF; stroke: #0891B2; stroke-width: 2.2; }
    .node-handoff .node-text { fill: #164E63; }
    .node-closed .node-shape { fill: #FFF1F2; stroke: #E11D48; stroke-width: 2.2; }
    .node-closed .node-text { fill: #881337; }
    .edge path { stroke-linecap: round; stroke-linejoin: round; opacity: 0.92; }
    .edge:hover path { stroke-width: 5px; opacity: 1; }
    .edge-label rect { fill: #FFFFFF; fill-opacity: 0.96; stroke-width: 1; }
    .edge-label text { font-size: 13px; font-weight: 600; }
    .edge-label.tone-struct rect { stroke: #CBD5E1; } .edge-label.tone-struct text { fill: #475569; }
    .edge-label.tone-pos rect { fill: #F0FDF4; stroke: #86EFAC; } .edge-label.tone-pos text { fill: #166534; }
    .edge-label.tone-neg rect { fill: #FFF7ED; stroke: #FDBA74; } .edge-label.tone-neg text { fill: #9A3412; }
    .edge-label.tone-neutral rect { fill: #F8FAFC; stroke: #CBD5E1; } .edge-label.tone-neutral text { fill: #475569; }
    .edge-label.tone-life rect { fill: #FAF5FF; stroke: #C4B5FD; } .edge-label.tone-life text { fill: #6D28D9; }
    .return-reference path { opacity: 0.82; }
  </style>

  <rect x="0" y="0" width="2200" height="5310" fill="#FFFFFF" />
  <text x="34" y="48" class="chart-title">Kiki 猎头通话策略节点图｜纵向阅读版</text>
  <text x="34" y="78" class="chart-subtitle">从上到下阅读；横向只表示同一判断的并列去向；↺ 表示回到既有节点。</text>
  <text x="34" y="108" class="chart-subtitle">41 个业务节点 · 59 条业务跳转 · 7 个决策阶段 · 未增加图外规则</text>

      <text x="42" y="1920" class="phase-index">L3</text>
      <text x="42" y="1950" class="phase-title">机会响应与推进深度</text>
      <text x="42" y="1987" class="phase-question">候选人愿意投入到什么程度？</text>
      <text x="42" y="2014" class="phase-output">输出：岗位深聊、长期价值或岗位拒绝</text>
    </g>
    <g id="phase-L4" class="phase">

      <text x="42" y="2650" class="phase-title">拒绝诊断与机会空间重构</text>
      <text x="42" y="2687" class="phase-question">拒绝关闭了什么，又留下什么可能？</text>
      <text x="42" y="2714" class="phase-output">输出：关闭、目标方向或新切口</text>

    <g id="phase-L5" class="phase">
      <rect x="12" y="3865" width="2176" height="810" rx="14" fill="#ECFEFF" stroke="#CBD5E1" />
      <rect x="12" y="3865" width="10" height="810" rx="5" fill="#06B6D4" />
      <line x1="290" y1="3882" x2="290" y2="4658" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="42" y="3910" class="phase-index">L5</text>
      <text x="42" y="3940" class="phase-title">关系承接与本通结果</text>
      <text x="42" y="3977" class="phase-question">本通形成什么关系资产？</text>
      <text x="42" y="4004" class="phase-output">输出：联系池、回拨、平台承接或关闭</text>
    </g>
    <g id="phase-L6" class="phase">
      <rect x="12" y="4685" width="2176" height="610" rx="14" fill="#FAF5FF" stroke="#CBD5E1" />
      <rect x="12" y="4685" width="10" height="610" rx="5" fill="#A855F7" />
      <line x1="290" y1="4702" x2="290" y2="5278" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="42" y="4730" class="phase-index">L6</text>

  <script id="embedded-state" type="application/json">{"schemaVersion":1,"nodes":{},"edges":{},"notes":[],"savedAt":null}</script>
  <script>(function initKikiFlow(globalObject) {
  'use strict';

  const SCHEMA_VERSION = 1;
  const STATE_VALUES = new Set([0, 1, 2]);
  const STATE_LABELS = ['未判断', '存在且正确', '标记为错误'];
  const STATE_COLORS = ['#64748b', '#16a34a', '#dc2626'];
  const NOTE_WIDTH = 220;
  const NOTE_HEIGHT = 120;
  const NOTE_MAX_X = 2200 - NOTE_WIDTH;
  const NOTE_MAX_Y = 5310 - NOTE_HEIGHT;
  const EXPORT_HEIGHT = 5310;
  const EXPORT_NOTE_HEADER_HEIGHT = 28;
  const EXPORT_NOTE_TEXT_Y = 51;
  const EXPORT_NOTE_FONT_SIZE = 13;
  const EXPORT_NOTE_LINE_HEIGHT = 19;
  const EXPORT_NOTE_BOTTOM_PADDING = 13;

  function nextState(value) {
    if (value === 0) return 1;
    if (value === 1) return 2;
    if (value === 2) return 0;
    return 0;
  }

  function createEmptyState(nodeIds, edgeIds) {
    return {
      schemaVersion: SCHEMA_VERSION,
      nodes: Object.fromEntries(nodeIds.map((id) => [id, 0])),
      edges: Object.fromEntries(edgeIds.map((id) => [id, 0])),
      notes: [],
      savedAt: null
    };
  }

  function normalizedValue(value) {
    return STATE_VALUES.has(value) ? value : 0;
  }

  function clamp(value, minimum, maximum) {
    return Math.min(maximum, Math.max(minimum, value));
  }

  function normalizeState(raw, nodeIds, edgeIds) {
    if (!raw || typeof raw !== 'object') throw new Error('状态文件必须是对象');
    if (raw.schemaVersion !== SCHEMA_VERSION) {
      throw new Error(`不支持的 schemaVersion：${String(raw.schemaVersion)}`);
    }

    const sourceNodes = raw.nodes && typeof raw.nodes === 'object' ? raw.nodes : {};
    const sourceEdges = raw.edges && typeof raw.edges === 'object' ? raw.edges : {};
    const notes = Array.isArray(raw.notes)
      ? raw.notes
          .filter((note) => note && typeof note === 'object')
          .map((note, index) => ({
            id: typeof note.id === 'string' && note.id ? note.id : `note-import-${index + 1}`,
            x: clamp(Number.isFinite(Number(note.x)) ? Number(note.x) : 0, 0, NOTE_MAX_X),
            y: clamp(Number.isFinite(Number(note.y)) ? Number(note.y) : 0, 0, NOTE_MAX_Y),
            text: typeof note.text === 'string' ? note.text : ''
          }))
      : [];

    return {
      schemaVersion: SCHEMA_VERSION,
      nodes: Object.fromEntries(nodeIds.map((id) => [id, normalizedValue(sourceNodes[id])])),
      edges: Object.fromEntries(edgeIds.map((id) => [id, normalizedValue(sourceEdges[id])])),
      notes,
      savedAt: typeof raw.savedAt === 'string' ? raw.savedAt : null
    };
  }

  function countStates(record) {
    const counts = [0, 0, 0];
    for (const value of Object.values(record)) counts[normalizedValue(value)] += 1;
    return counts;
  }

  function wrapNoteText(text, limit = 16) {
    const safeLimit = Math.max(1, Math.floor(Number(limit) || 16));
    const result = [];
    for (const paragraph of String(text).replaceAll('\r\n', '\n').split('\n')) {
      const characters = Array.from(paragraph);
      if (characters.length === 0) {
        result.push('');
        continue;
      }
      for (let index = 0; index < characters.length; index += safeLimit) {
        result.push(characters.slice(index, index + safeLimit).join(''));
      }
    }
    return result;
  }

  function layoutPureSvgNote(note, exportHeight = EXPORT_HEIGHT) {
    const lines = wrapNoteText(note && note.text ? note.text : '（空备注）', 15);
    const textHeight = EXPORT_NOTE_FONT_SIZE + Math.max(0, lines.length - 1) * EXPORT_NOTE_LINE_HEIGHT;
    const naturalHeight = EXPORT_NOTE_TEXT_Y + textHeight + EXPORT_NOTE_BOTTOM_PADDING;
    const height = Math.min(naturalHeight, exportHeight);
    const availableTextHeight = Math.max(1, height - EXPORT_NOTE_TEXT_Y - EXPORT_NOTE_BOTTOM_PADDING);
    const textScale = Math.min(1, availableTextHeight / textHeight);
    const y = clamp(Number(note && note.y) || 0, 0, Math.max(0, exportHeight - height));

    return {
      x: clamp(Number(note && note.x) || 0, 0, NOTE_MAX_X),
      y,
      lines,
      height,
      fontSize: EXPORT_NOTE_FONT_SIZE * textScale,
      lineHeight: EXPORT_NOTE_LINE_HEIGHT * textScale,
      textBottom: EXPORT_NOTE_TEXT_Y + textHeight * textScale
    };
  }

  function loadStoredOrEmbeddedState({ storage, storageKey, embeddedState, nodeIds, edgeIds }) {
    let fallbackState;
    let fallbackWarning = '';
    try {
      fallbackState = normalizeState(embeddedState, nodeIds, edgeIds);
    } catch (error) {
      fallbackState = createEmptyState(nodeIds, edgeIds);
      fallbackWarning = `内嵌状态无法恢复：${error.message}`;
    }

    try {
      const saved = storage.getItem(storageKey);
      if (!saved) return { state: fallbackState, warning: fallbackWarning };
      return {
        state: normalizeState(JSON.parse(saved), nodeIds, edgeIds),
        warning: ''
      };
    } catch (error) {
      return {
        state: fallbackState,
        warning: `自动保存无法恢复，已使用内嵌状态：${error.message}${fallbackWarning ? `；${fallbackWarning}` : ''}`
      };
    }
  }

  function clearEditableHtmlTransientState(root) {
    const saveStatus = root.querySelector('#save-status');
    if (saveStatus) saveStatus.textContent = '';
    const errorStatus = root.querySelector('#error-status');
    if (errorStatus) {
      errorStatus.hidden = true;
      errorStatus.textContent = '';
    }
  }

  function boot() {
    const documentObject = globalObject.document;
    const app = documentObject.getElementById('kiki-flow-app');
    const svg = app && app.querySelector('.diagram-svg');
    if (!app || !svg) return;

    const nodeElements = Array.from(svg.querySelectorAll('.node[data-node-id]'));
    const edgeElements = Array.from(svg.querySelectorAll('.edge[id^="edge-"]'));
    const nodeIds = nodeElements.map((element) => element.dataset.nodeId);
    const edgeIds = edgeElements.map((element) => element.id);
    const errorStatus = documentObject.getElementById('error-status');

    function showError(message) {
      errorStatus.hidden = false;
      errorStatus.textContent = message;
    }

    function clearError() {
      errorStatus.hidden = true;
      errorStatus.textContent = '';
    }

    if (nodeElements.length !== 41 || edgeElements.length !== 59) {
      showError(`图结构校验失败：节点 ${nodeElements.length}/41，连线 ${edgeElements.length}/59`);
      return;
    }

    const documentMeta = documentObject.querySelector('meta[name="kiki-document-id"]');
    const documentId = documentMeta ? documentMeta.content : 'kiki-interactive-flow-v5';
    const storageKey = `kiki-flow-state:${documentId}`;
    const embeddedStateElement = documentObject.getElementById('embedded-state');
    let embeddedState;

    try {
      embeddedState = JSON.parse(embeddedStateElement.textContent || '{}');
    } catch (error) {
      showError(`内嵌状态无法读取：${error.message}`);
      embeddedState = createEmptyState(nodeIds, edgeIds);
    }

    let storage;
    try {
      storage = globalObject.localStorage;
    } catch (error) {
      storage = { getItem() { throw error; } };
    }
    const restored = loadStoredOrEmbeddedState({
      storage,
      storageKey,
      embeddedState,
      nodeIds,
      edgeIds
    });
    let state = restored.state;
    if (restored.warning) showError(restored.warning);

    installStateMarkers(svg);
    neutralizeOriginalLegend(svg);
    nodeElements.forEach((element) => enhanceNode(element));
    edgeElements.forEach((element) => enhanceEdge(element));
    const notesLayer = ensureNotesLayer();
    let isAddingNote = false;
    let noteSaveTimer = null;
    wireControls();

    function enhanceNode(element) {
      const id = element.dataset.nodeId;
      element.setAttribute('role', 'button');
      element.setAttribute('tabindex', '0');
      element.addEventListener('click', (event) => {
        event.stopPropagation();
        cycleRecordValue('nodes', id);
      });
      element.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        cycleRecordValue('nodes', id);
      });
    }

    function enhanceEdge(element) {
      const id = element.id;
      element.setAttribute('role', 'button');
      element.setAttribute('tabindex', '0');
      const directPaths = Array.from(element.children).filter(
        (child) => child.localName === 'path' && !child.classList.contains('edge-hit')
      );
      for (const pathElement of directPaths) {
        const hitPath = pathElement.cloneNode(false);
        hitPath.removeAttribute('marker-end');
        hitPath.removeAttribute('stroke-dasharray');
        hitPath.classList.add('edge-hit');
        hitPath.setAttribute('aria-hidden', 'true');
        element.appendChild(hitPath);
      }
      element.addEventListener('click', (event) => {
        event.stopPropagation();
        cycleRecordValue('edges', id);
      });
      element.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        cycleRecordValue('edges', id);
      });
    }

    function ensureNotesLayer() {
      const SVG_NS = 'http://www.w3.org/2000/svg';
      let layer = svg.querySelector('#notes-layer');
      if (!layer) {
        layer = documentObject.createElementNS(SVG_NS, 'g');
        layer.setAttribute('id', 'notes-layer');
        layer.setAttribute('aria-label', '自由备注');
        svg.appendChild(layer);
      }
      return layer;
    }

    function wireControls() {
      const addButton = documentObject.getElementById('add-note-button');
      const exportJsonButton = documentObject.getElementById('export-json-button');
      const importJsonButton = documentObject.getElementById('import-json-button');
      const importJsonInput = documentObject.getElementById('import-json-input');
      const exportPngButton = documentObject.getElementById('export-png-button');
      const exportHtmlButton = documentObject.getElementById('export-html-button');

      addButton.addEventListener('click', () => setAddMode(!isAddingNote));
      exportJsonButton.addEventListener('click', exportJson);
      importJsonButton.addEventListener('click', () => importJsonInput.click());
      exportPngButton.addEventListener('click', () => exportPng(exportPngButton));
      exportHtmlButton.addEventListener('click', exportEditableHtml);
      importJsonInput.addEventListener('change', async () => {
        const file = importJsonInput.files && importJsonInput.files[0];
        importJsonInput.value = '';
        if (!file) return;
        await importJson(file);
      });

      svg.addEventListener('pointerdown', (event) => {
        if (!isAddingNote) return;
        if (event.target.closest && event.target.closest('.flow-note')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const point = screenPointToSvg(event.clientX, event.clientY);
        const note = createNote(point.x - NOTE_WIDTH / 2, point.y - 22);
        state.notes.push(note);
        state.savedAt = new Date().toISOString();
        setAddMode(false);
        renderNotes();
        renderStats();
        saveState();
        globalObject.setTimeout(() => {
          const editor = notesLayer.querySelector(`[data-note-id="${cssEscape(note.id)}"] .note-editor`);
          if (editor) editor.focus();
        }, 0);
      }, true);
    }

    function setAddMode(enabled) {
      isAddingNote = Boolean(enabled);
      const button = documentObject.getElementById('add-note-button');
      button.setAttribute('aria-pressed', String(isAddingNote));
      button.textContent = isAddingNote ? '请在图中单击放置备注' : '添加备注';
      svg.classList.toggle('is-adding-note', isAddingNote);
    }

    function createNote(x, y) {
      return {
        id: `note-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        x: clamp(x, 0, NOTE_MAX_X),
        y: clamp(y, 0, NOTE_MAX_Y),
        text: ''
      };
    }

    function screenPointToSvg(clientX, clientY) {
      const point = svg.createSVGPoint();
      point.x = clientX;
      point.y = clientY;
      const matrix = svg.getScreenCTM();
      if (!matrix) return { x: 0, y: 0 };
      return point.matrixTransform(matrix.inverse());
    }

    function renderNotes() {
      notesLayer.replaceChildren(...state.notes.map((note) => createNoteElement(note)));
    }

    function createNoteElement(note) {
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const XHTML_NS = 'http://www.w3.org/1999/xhtml';
      const group = documentObject.createElementNS(SVG_NS, 'g');
      group.classList.add('flow-note');
      group.dataset.noteId = note.id;
      group.setAttribute('transform', `translate(${note.x} ${note.y})`);
      group.addEventListener('click', (event) => event.stopPropagation());
      group.addEventListener('pointerdown', (event) => event.stopPropagation());

      const foreignObject = documentObject.createElementNS(SVG_NS, 'foreignObject');
      foreignObject.setAttribute('width', String(NOTE_WIDTH));
      foreignObject.setAttribute('height', String(NOTE_HEIGHT));

      const card = documentObject.createElementNS(XHTML_NS, 'div');
      card.className = 'note-card';
      const header = documentObject.createElementNS(XHTML_NS, 'div');
      header.className = 'note-header';
      header.setAttribute('aria-label', '拖动备注');
      const label = documentObject.createElementNS(XHTML_NS, 'span');
      label.textContent = '备注';
      const removeButton = documentObject.createElementNS(XHTML_NS, 'button');
      removeButton.className = 'note-remove';
      removeButton.type = 'button';
      removeButton.setAttribute('aria-label', '删除这条备注');
      removeButton.textContent = '×';
      header.append(label, removeButton);

      const editor = documentObject.createElementNS(XHTML_NS, 'div');
      editor.className = 'note-editor';
      editor.contentEditable = 'true';
      editor.spellcheck = false;
      editor.setAttribute('role', 'textbox');
      editor.setAttribute('aria-multiline', 'true');
      editor.dataset.placeholder = '输入备注…';
      editor.textContent = note.text;
      card.append(header, editor);
      foreignObject.appendChild(card);
      group.appendChild(foreignObject);

      editor.addEventListener('input', () => {
        note.text = editor.textContent || '';
        state.savedAt = new Date().toISOString();
        scheduleNoteSave();
      });
      editor.addEventListener('pointerdown', (event) => event.stopPropagation());
      editor.addEventListener('click', (event) => event.stopPropagation());
      editor.addEventListener('blur', () => {
        note.text = editor.textContent || '';
        state.savedAt = new Date().toISOString();
        saveState();
      });

      removeButton.addEventListener('pointerdown', (event) => event.stopPropagation());
      removeButton.addEventListener('click', (event) => {
        event.stopPropagation();
        state.notes = state.notes.filter((item) => item.id !== note.id);
        state.savedAt = new Date().toISOString();
        renderNotes();
        renderStats();
        saveState();
      });

      header.addEventListener('pointerdown', (event) => startNoteDrag(event, note, group, header));
      return group;
    }

    function startNoteDrag(event, note, group, handle) {
      if (event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      const startPoint = screenPointToSvg(event.clientX, event.clientY);
      const startX = note.x;
      const startY = note.y;
      handle.setPointerCapture(event.pointerId);
      group.classList.add('is-dragging');

      function move(moveEvent) {
        const point = screenPointToSvg(moveEvent.clientX, moveEvent.clientY);
        note.x = clamp(startX + point.x - startPoint.x, 0, NOTE_MAX_X);
        note.y = clamp(startY + point.y - startPoint.y, 0, NOTE_MAX_Y);
        group.setAttribute('transform', `translate(${note.x} ${note.y})`);
      }

      function finish(finishEvent) {
        if (handle.hasPointerCapture(finishEvent.pointerId)) handle.releasePointerCapture(finishEvent.pointerId);
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', finish);
        handle.removeEventListener('pointercancel', finish);
        group.classList.remove('is-dragging');
        state.savedAt = new Date().toISOString();
        saveState();
      }

      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', finish);
      handle.addEventListener('pointercancel', finish);
    }

    function scheduleNoteSave() {
      if (noteSaveTimer) globalObject.clearTimeout(noteSaveTimer);
      noteSaveTimer = globalObject.setTimeout(() => {
        noteSaveTimer = null;
        saveState();
      }, 250);
    }

    function exportJson() {
      state.savedAt = new Date().toISOString();
      saveState();
      const blob = new Blob([`${JSON.stringify(state, null, 2)}\n`], { type: 'application/json;charset=utf-8' });
      downloadBlob(blob, `kiki-flow-progress-${filenameTimestamp()}.json`);
    }

    async function importJson(file) {
      try {
        const parsed = JSON.parse(await file.text());
        const imported = normalizeState(parsed, nodeIds, edgeIds);
        state = imported;
        state.savedAt = new Date().toISOString();
        renderAllStates();
        renderNotes();
        renderStats();
        saveState();
        clearError();
      } catch (error) {
        showError(`导入失败，当前状态未改变：${error.message}`);
      }
    }

    function exportEditableHtml() {
      try {
        state.savedAt = new Date().toISOString();
        saveState();
        const clone = documentObject.documentElement.cloneNode(true);
        const newDocumentId = `kiki-flow-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const meta = clone.querySelector('meta[name="kiki-document-id"]');
        if (meta) meta.setAttribute('content', newDocumentId);
        const embedded = clone.querySelector('#embedded-state');
        embedded.textContent = JSON.stringify(state).replaceAll('<', '\\u003c');
        clone.querySelectorAll('.edge-hit').forEach((element) => element.remove());
        const clonedNotesLayer = clone.querySelector('#notes-layer');
        if (clonedNotesLayer) clonedNotesLayer.remove();
        const clonedSvg = clone.querySelector('.diagram-svg');
        if (clonedSvg) clonedSvg.classList.remove('is-adding-note');
        const addButton = clone.querySelector('#add-note-button');
        if (addButton) {
          addButton.setAttribute('aria-pressed', 'false');
          addButton.textContent = '添加备注';
        }
        clearEditableHtmlTransientState(clone);
        const html = `<!doctype html>\n${clone.outerHTML}\n`;
        downloadBlob(
          new Blob([html], { type: 'text/html;charset=utf-8' }),
          `kiki-flow-editable-${filenameTimestamp()}.html`
        );
      } catch (error) {
        showError(`HTML 导出失败：${error.message}`);
      }
    }

    function createExportSvg() {
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const outer = documentObject.createElementNS(SVG_NS, 'svg');
      outer.setAttribute('xmlns', SVG_NS);
      outer.setAttribute('width', '2560');
      outer.setAttribute('height', '5310');
      outer.setAttribute('viewBox', '0 0 2560 5310');
      outer.setAttribute('role', 'img');
      outer.setAttribute('aria-label', 'Kiki 猎头通话策略交互检查结果');

      const background = svgElement('rect', { x: 0, y: 0, width: 2560, height: 5310, fill: '#ffffff' });
      outer.appendChild(background);

      const graphClone = svg.cloneNode(true);
      graphClone.setAttribute('x', '0');
      graphClone.setAttribute('y', '0');
      graphClone.setAttribute('width', '2200');
      graphClone.setAttribute('height', '5310');
      graphClone.querySelectorAll('.edge-hit').forEach((element) => element.remove());
      const oldNotesLayer = graphClone.querySelector('#notes-layer');
      if (oldNotesLayer) oldNotesLayer.remove();
      graphClone.classList.remove('is-adding-note');

      const exportStyle = documentObject.createElementNS(SVG_NS, 'style');
      exportStyle.textContent = exportStateCss();
      graphClone.appendChild(exportStyle);
      graphClone.appendChild(createPureSvgNotesLayer());
      outer.appendChild(graphClone);
      outer.appendChild(createExportSidebar());
      return new XMLSerializer().serializeToString(outer);

      function svgElement(tagName, attributes = {}) {
        const element = documentObject.createElementNS(SVG_NS, tagName);
        for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, String(value));
        return element;
      }

      function createPureSvgNotesLayer() {
        const layer = svgElement('g', { id: 'notes-export-layer' });
        for (const note of state.notes) {
          const layout = layoutPureSvgNote(note);
          const group = svgElement('g', { transform: `translate(${layout.x} ${layout.y})` });
          group.appendChild(svgElement('rect', {
            x: 0, y: 0, width: NOTE_WIDTH, height: layout.height, rx: 10,
            fill: '#fffdf0', stroke: '#d4a72c', 'stroke-width': 2
          }));
          group.appendChild(svgElement('rect', {
            x: 1, y: 1, width: NOTE_WIDTH - 2, height: EXPORT_NOTE_HEADER_HEIGHT, rx: 9,
            fill: '#fef3c7'
          }));
          const title = svgElement('text', {
            x: 10, y: 19, fill: '#713f12', 'font-size': 12, 'font-weight': 700,
            'font-family': 'Microsoft YaHei, PingFang SC, Arial, sans-serif'
          });
          title.textContent = '备注';
          group.appendChild(title);

          const textElement = svgElement('text', {
            x: 10, y: EXPORT_NOTE_TEXT_Y, fill: '#422006', 'font-size': layout.fontSize,
            'font-family': 'Microsoft YaHei, PingFang SC, Arial, sans-serif'
          });
          layout.lines.forEach((line, index) => {
            const span = svgElement('tspan', { x: 10, dy: index === 0 ? 0 : layout.lineHeight });
            span.textContent = line || ' ';
            textElement.appendChild(span);
          });
          group.appendChild(textElement);
          layer.appendChild(group);
        }
        return layer;
      }

      function createExportSidebar() {
        const group = svgElement('g', { transform: 'translate(2200 0)' });
        group.appendChild(svgElement('rect', {
          x: 0, y: 0, width: 360, height: 5310,
          fill: '#ffffff', stroke: '#cbd5e1', 'stroke-width': 2
        }));
        appendText(group, '检查状态', 28, 48, { size: 24, weight: 700, fill: '#0f172a' });
        appendText(group, '灰 → 绿 → 红', 28, 78, { size: 13, fill: '#64748b' });
        group.appendChild(svgElement('line', { x1: 28, y1: 98, x2: 332, y2: 98, stroke: '#cbd5e1' }));

        appendCountSection(group, '节点 · 41', countStates(state.nodes), 130);
        appendCountSection(group, '连线 · 59', countStates(state.edges), 316);
        appendText(group, `备注 · ${state.notes.length}`, 28, 514, { size: 17, weight: 700, fill: '#0f172a' });
        group.appendChild(svgElement('line', { x1: 28, y1: 540, x2: 332, y2: 540, stroke: '#cbd5e1' }));
        appendText(group, '操作', 28, 578, { size: 17, weight: 700, fill: '#0f172a' });
        ['添加备注', '导出进度 JSON', '导入进度 JSON', '导出当前页面 PNG', '导出可继续编辑 HTML']
          .forEach((label, index) => appendButton(group, label, 28, 600 + index * 52));
        const savedText = state.savedAt
          ? `已保存 · ${new Date(state.savedAt).toLocaleString('zh-CN', { hour12: false })}`
          : '尚未保存';
        appendText(group, savedText, 28, 890, { size: 12, fill: '#64748b' });
        return group;
      }

      function appendCountSection(parent, titleText, counts, top) {
        appendText(parent, titleText, 28, top, { size: 17, weight: 700, fill: '#0f172a' });
        const labels = ['灰色 · 未判断', '绿色 · 正确', '红色 · 错误'];
        const colors = ['#64748b', '#16a34a', '#dc2626'];
        const fills = ['#f8fafc', '#ecfdf5', '#fef2f2'];
        counts.forEach((count, index) => {
          const y = top + 22 + index * 44;
          parent.appendChild(svgElement('rect', {
            x: 28, y, width: 304, height: 36, rx: 8,
            fill: fills[index], stroke: index === 0 ? '#cbd5e1' : colors[index], 'stroke-opacity': 0.45
          }));
          parent.appendChild(svgElement('circle', { cx: 44, cy: y + 18, r: 5, fill: colors[index] }));
          appendText(parent, labels[index], 58, y + 23, { size: 13, fill: colors[index] });
          appendText(parent, String(count), 312, y + 24, { size: 17, weight: 700, fill: colors[index], anchor: 'end' });
        });
      }

      function appendButton(parent, label, x, y) {
        parent.appendChild(svgElement('rect', {
          x, y, width: 304, height: 40, rx: 8,
          fill: '#ffffff', stroke: '#94a3b8'
        }));
        appendText(parent, label, x + 152, y + 25, { size: 13, weight: 700, fill: '#1e293b', anchor: 'middle' });
      }

      function appendText(parent, value, x, y, options = {}) {
        const textElement = svgElement('text', {
          x, y,
          fill: options.fill || '#0f172a',
          'font-size': options.size || 13,
          'font-weight': options.weight || 400,
          'text-anchor': options.anchor || 'start',
          'font-family': 'Microsoft YaHei, PingFang SC, Arial, sans-serif'
        });
        textElement.textContent = value;
        parent.appendChild(textElement);
      }
    }

    async function exportPng(button) {
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = '正在导出 PNG…';
      clearError();
      let sourceUrl = '';
      try {
        state.savedAt = new Date().toISOString();
        saveState();
        const exportMarkup = createExportSvg();
        sourceUrl = URL.createObjectURL(new Blob([exportMarkup], { type: 'image/svg+xml;charset=utf-8' }));
        const image = await loadImage(sourceUrl);
        const canvas = documentObject.createElement('canvas');
        canvas.width = 2560;
        canvas.height = 5310;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('浏览器无法创建 Canvas 2D 上下文');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        const pngBlob = await canvasToBlob(canvas);
        downloadBlob(pngBlob, `kiki-flow-page-${filenameTimestamp()}.png`);
      } catch (error) {
        showError(`PNG 导出失败：${error.message}`);
      } finally {
        if (sourceUrl) URL.revokeObjectURL(sourceUrl);
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('浏览器无法载入导出用 SVG 图像'));
        image.src = url;
      });
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('浏览器未生成 PNG 数据'));
        }, 'image/png');
      });
    }

    function exportStateCss() {
      return `
        .node[data-state="0"] .node-shape{fill:#f8fafc!important;stroke:#64748b!important}.node[data-state="0"] .node-text{fill:#334155!important}
        .node[data-state="1"] .node-shape{fill:#ecfdf5!important;stroke:#16a34a!important}.node[data-state="1"] .node-text{fill:#14532d!important}
        .node[data-state="2"] .node-shape{fill:#fef2f2!important;stroke:#dc2626!important}.node[data-state="2"] .node-text{fill:#7f1d1d!important}
        .edge[data-state="0"]>path{stroke:#94a3b8!important}.edge[data-state="1"]>path{stroke:#16a34a!important}.edge[data-state="2"]>path{stroke:#dc2626!important}
        .edge-label-anchor{fill:none!important;stroke-width:1.5!important;pointer-events:none}.edge[data-state="0"] .edge-label-anchor{stroke:#94a3b8!important}.edge[data-state="1"] .edge-label-anchor{stroke:#16a34a!important}.edge[data-state="2"] .edge-label-anchor{stroke:#dc2626!important}
        .edge[data-state="0"] .edge-label rect{fill:#f8fafc!important;stroke:#cbd5e1!important}.edge[data-state="0"] .edge-label text{fill:#475569!important}
        .edge[data-state="1"] .edge-label rect{fill:#ecfdf5!important;stroke:#86efac!important}.edge[data-state="1"] .edge-label text{fill:#166534!important}
        .edge[data-state="2"] .edge-label rect{fill:#fef2f2!important;stroke:#fca5a5!important}.edge[data-state="2"] .edge-label text{fill:#991b1b!important}
        #legend .edge-label rect{fill:#f8fafc!important;stroke:#cbd5e1!important}#legend .edge-label text,#legend .legend-text{fill:#64748b!important}#legend line{stroke:#94a3b8!important}
      `;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = documentObject.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      documentObject.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      globalObject.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function filenameTimestamp() {
      return new Date().toISOString().replace(/[:.]/g, '-');
    }

    function cycleRecordValue(kind, id) {
      state[kind][id] = nextState(state[kind][id]);
      state.savedAt = new Date().toISOString();
      renderElementState(kind, id);
      renderStats();
      saveState();
    }

    function renderElementState(kind, id) {
      const value = state[kind][id];
      const element = kind === 'nodes'
        ? svg.querySelector(`.node[data-node-id="${cssEscape(id)}"]`)
        : documentObject.getElementById(id);
      if (!element) return;
      element.dataset.state = String(value);
      element.setAttribute('aria-pressed', value === 0 ? 'false' : 'true');
      const subject = kind === 'nodes' ? `节点 ${id}` : `连线 ${id}`;
      element.setAttribute('aria-label', `${subject}：${STATE_LABELS[value]}。单击切换状态`);
      if (kind === 'edges') {
        for (const pathElement of Array.from(element.children)) {
          if (pathElement.localName !== 'path' || pathElement.classList.contains('edge-hit')) continue;
          pathElement.setAttribute('marker-end', `url(#arrow-state-${value})`);
        }
      }
    }

    function renderAllStates() {
      nodeIds.forEach((id) => renderElementState('nodes', id));
      edgeIds.forEach((id) => renderElementState('edges', id));
    }

    function renderCountGrid(containerId, counts, total) {
      const container = documentObject.getElementById(containerId);
      const labels = ['灰色 · 未判断', '绿色 · 正确', '红色 · 错误'];
      const classes = ['is-gray', 'is-green', 'is-red'];
      container.replaceChildren(...counts.map((count, index) => {
        const row = documentObject.createElement('div');
        row.className = `count-row ${classes[index]}`;
        row.innerHTML = `<span class="count-dot" aria-hidden="true"></span><span>${labels[index]}</span><strong>${count}</strong>`;
        return row;
      }));
      container.setAttribute('aria-label', `共 ${total} 个`);
    }

    function renderStats() {
      renderCountGrid('node-counts', countStates(state.nodes), nodeIds.length);
      renderCountGrid('edge-counts', countStates(state.edges), edgeIds.length);
      documentObject.getElementById('note-count').textContent = String(state.notes.length);
    }

    function saveState() {
      const saveStatus = documentObject.getElementById('save-status');
      try {
        globalObject.localStorage.setItem(storageKey, JSON.stringify(state));
        const time = state.savedAt ? new Date(state.savedAt).toLocaleTimeString('zh-CN', { hour12: false }) : '';
        saveStatus.textContent = time ? `已自动保存 · ${time}` : '已载入，尚无修改';
      } catch (error) {
        saveStatus.textContent = '自动保存不可用，请导出 JSON 保存';
        showError(`自动保存失败：${error.message}`);
      }
    }

    renderAllStates();
    renderNotes();
    renderStats();
    saveState();

    globalObject.KikiFlowDebug = {
      getState: () => JSON.parse(JSON.stringify(state)),
      getCounts: () => ({ nodes: countStates(state.nodes), edges: countStates(state.edges) }),
      cycleNode: (id) => cycleRecordValue('nodes', id),
      cycleEdge: (id) => cycleRecordValue('edges', id),
      addNote: (x, y, text = '') => {
        const note = createNote(x, y);
        note.text = String(text);
        state.notes.push(note);
        state.savedAt = new Date().toISOString();
        renderNotes();
        renderStats();
        saveState();
        return note.id;
      },
      renderNotes,
      nodeIds: nodeIds.slice(),
      edgeIds: edgeIds.slice(),
      storageKey,
      stateColors: STATE_COLORS.slice()
    };
  }

  function installStateMarkers(svg) {
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS(SVG_NS, 'defs'), svg.firstChild);
    STATE_COLORS.forEach((color, index) => {
      if (defs.querySelector(`#arrow-state-${index}`)) return;
      const marker = document.createElementNS(SVG_NS, 'marker');
      marker.setAttribute('id', `arrow-state-${index}`);
      marker.setAttribute('markerWidth', '12');
      marker.setAttribute('markerHeight', '12');
      marker.setAttribute('refX', '10');
      marker.setAttribute('refY', '5');
      marker.setAttribute('orient', 'auto');
      marker.setAttribute('markerUnits', 'strokeWidth');
      const markerPath = document.createElementNS(SVG_NS, 'path');
      markerPath.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
      markerPath.setAttribute('fill', color);
      marker.appendChild(markerPath);
      defs.appendChild(marker);
    });
  }

  function neutralizeOriginalLegend(svg) {
    const line = svg.querySelector('#legend line[marker-end]');
    if (line) line.setAttribute('marker-end', 'url(#arrow-state-0)');
  }

  function cssEscape(value) {
    if (globalObject.CSS && typeof globalObject.CSS.escape === 'function') return globalObject.CSS.escape(value);
    return String(value).replaceAll('"', '\\"');
  }

  const api = {
    nextState,
    createEmptyState,
    normalizeState,
    countStates,
    wrapNoteText,
    layoutPureSvgNote,
    loadStoredOrEmbeddedState,
    clearEditableHtmlTransientState
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (globalObject && globalObject.document) {
    globalObject.KikiFlowApp = api;
    globalObject.addEventListener('DOMContentLoaded', boot, { once: true });
  }
})(typeof window === 'undefined' ? globalThis : window);
</script>
</body>
</html>
